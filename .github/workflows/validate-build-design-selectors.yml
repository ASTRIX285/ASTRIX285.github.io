name: Validate Build Design selectors

on:
  pull_request:
    paths:
      - 'astrix-app/pages/guardian-workspace-v2/paradox-build-space/**'
      - 'astrix-app/pages/guardian-workspace-v2/paradox-build-space-handoff.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-artifact.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-bungie-auth.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-bungie-profile.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-session-continuity.mjs'
      - 'astrix-app/tools/test-build-design-artifact-intent.mjs'
      - 'astrix-app/tools/test-build-space-character-isolation.mjs'
      - 'astrix-app/tools/test-guardian-session-continuity.mjs'
      - '.github/workflows/validate-build-design-selectors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Build Design modules
        run: |
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-build-state.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-build-space.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space-handoff.mjs
          node --check astrix-app/pages/guardian-workspace-v2/guardian-artifact.mjs
          node --check astrix-app/pages/guardian-workspace-v2/guardian-bungie-auth.mjs
          node --check astrix-app/pages/guardian-workspace-v2/guardian-bungie-profile.mjs
          node --check astrix-app/pages/guardian-workspace-v2/guardian-session-continuity.mjs
      - name: Validate shared Super formation dependency
        run: node astrix-app/tools/validate-super-formation.mjs
      - name: Test intended Artifact configuration
        run: node astrix-app/tools/test-build-design-artifact-intent.mjs
      - name: Test character-scoped Build Space handoff
        run: node astrix-app/tools/test-build-space-character-isolation.mjs
      - name: Test Character and Build session continuity
        run: node astrix-app/tools/test-guardian-session-continuity.mjs
