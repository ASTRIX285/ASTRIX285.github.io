name: Validate Build Design selectors

on:
  pull_request:
    paths:
      - 'astrix-app/pages/guardian-workspace-v2/paradox-build-space/**'
      - 'astrix-app/tools/test-build-design-artifact-intent.mjs'
      - '.github/workflows/validate-build-design-selectors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Build Design modules
        run: |
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-build-state.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-build-space.mjs
      - name: Test intended Artifact configuration
        run: node astrix-app/tools/test-build-design-artifact-intent.mjs
