name: ASTRIX Stage 2 Weapon Evidence Probe

on:
  push:
    branches:
      - feature/astrix-multigame-platform
    paths:
      - '.github/workflows/astrix-stage2-weapon-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Print equipped weapon evidence for Stage 2 fixtures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='astrix-app/data/paradox-forge/beta';
          const fixtures=JSON.parse(fs.readFileSync(`${root}/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json`,'utf8'));
          const manifest=JSON.parse(fs.readFileSync(`${root}/beta-bungie-manifest-cache.json`,'utf8'));
          const ids=JSON.parse(fs.readFileSync(`${root}/beta-component-identities.json`,'utf8'));
          const idMap=new Map((ids.identities??[]).map(x=>[Number(x.bungieHash),x]));
          const m=manifest.inventoryItems??{};
          const targets=new Set(['PF-BETA-10','PF-BETA-13','PF-BETA-14','PF-BETA-15','PF-BETA-19']);
          for(const f of fixtures.fixtures.filter(x=>targets.has(x.fixtureId))){
            console.log(`FIXTURE ${f.fixtureId} ${f.displayName}`);
            for(const raw of f.rawDim?.equipped??[]){
              const row=m[String(raw.hash)]??null;
              const id=idMap.get(Number(raw.hash))??null;
              const sourceKind=id?.sourceKind ?? (Number(row?.itemType)===3?'weapon':'');
              if(sourceKind!=='weapon') continue;
              console.log(JSON.stringify({
                hash:Number(raw.hash),
                name:row?.display?.name??id?.name??null,
                description:row?.display?.description??id?.description??'',
                traitIds:row?.traitIds??id?.traitIds??[],
                intrinsicPlugHashes:row?.intrinsicPlugHashes??[],
                itemTypeDisplayName:row?.itemTypeDisplayName??'',
                ammoType:row?.equippingBlock?.ammoType??null,
                uniqueLabelHash:row?.equippingBlock?.uniqueLabelHash??null,
                socketOverrides:raw.socketOverrides??null
              }));
              for(const ph of row?.intrinsicPlugHashes??[]){
                const p=m[String(ph)]??idMap.get(Number(ph))??null;
                console.log('  INTRINSIC '+JSON.stringify({hash:Number(ph),name:p?.display?.name??p?.name??null,description:p?.display?.description??p?.description??'',traitIds:p?.traitIds??[]}));
              }
            }
          }
          NODE
      - name: Remove temporary probe workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'ASTRIX Probe Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/astrix-stage2-weapon-probe.yml
          git commit -m 'Remove temporary Stage 2 weapon probe'
          git push origin HEAD:feature/astrix-multigame-platform
