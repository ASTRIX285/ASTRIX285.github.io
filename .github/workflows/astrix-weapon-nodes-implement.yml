name: ASTRIX Weapon Nodes Implement
'on':
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-weapon-nodes-implement.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Snapshot PF-BETA before
        run: |
          cat > /tmp/snapshot.mjs <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import {pathToFileURL} from 'node:url';
          const root=process.cwd(),d=path.join(root,'astrix-app/data/paradox-forge/beta'),p=path.join(root,'astrix-app/pages/guardian-workspace-v2');const names=['ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json','beta-component-identities.json','beta-bungie-manifest-cache.json','beta-bungie-manifest-cache-trait-direction-extension.json'];const routes=new Map(names.map(n=>[n,path.join(d,n)]));globalThis.document={readyState:'loading',addEventListener(){},dispatchEvent(){return true},getElementById(){return null},querySelector(){return null},createElement(){return {setAttribute(){},appendChild(){},style:{},addEventListener(){}}}};globalThis.CustomEvent=class{constructor(t,i={}){this.type=t;this.detail=i.detail}};globalThis.fetch=async input=>{const s=String(input),n=[...routes.keys()].find(k=>s.endsWith(k));if(!n)return{ok:false,status:404,json:async()=>({})};const txt=await fs.readFile(routes.get(n),'utf8');return{ok:true,status:200,json:async()=>JSON.parse(txt)}};const loader=await import(pathToFileURL(path.join(p,'guardian-fixture-loader.mjs')).href+'?snap='+Date.now());const engine=await import(pathToFileURL(path.join(p,'guardian-paradox-engine.mjs')).href+'?snap='+Date.now());const list=(await loader.listBetaFixtures()).filter(x=>x.fixtureId.startsWith('PF-BETA-'));const out=[];for(const f of list){const b=await loader.loadBetaFixture(f.fixtureId),a=engine.analyzeGuardianBuild(b);out.push({fixtureId:f.fixtureId,confidence:a.confidence.level,loops:a.buildLoop.map(x=>[x.from.hash,x.output,x.to.hash,x.source]).sort(),weapons:a.weaponContribution.map(x=>({hash:x.hash,status:x.status,roles:x.roles}))});}console.log(JSON.stringify(out));
          NODE
          node /tmp/snapshot.mjs > /tmp/pf-beta-before.json
      - name: Apply implementation
        run: python3 .astrix-community/implement_weapon_nodes.py
      - name: Verify exact PF-BETA clean diff
        run: |
          node /tmp/snapshot.mjs > /tmp/pf-beta-after.json
          cmp /tmp/pf-beta-before.json /tmp/pf-beta-after.json
          echo PF_BETA_CLEAN_DIFF=true
      - name: Run weapon node self-test
        run: node astrix-app/tools/test-weapon-roll-nodes.mjs
      - name: Verify fixture data untouched
        run: git diff --exit-code -- astrix-app/data/paradox-forge/beta/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json
      - name: Commit implementation and clean scaffolding
        run: |
          set -euo pipefail
          rm -f .astrix-community/weapon_roll_probe.py .astrix-community/weapon_roll_coverage.py .astrix-community/perk_evidence_probe.py .astrix-community/live_perk_lookup.py .astrix-community/implement_weapon_nodes.py
          rm -f .github/workflows/astrix-weapon-roll-probe.yml .github/workflows/astrix-weapon-roll-coverage.yml .github/workflows/astrix-perk-evidence-probe.yml .github/workflows/astrix-live-perk-lookup.yml .github/workflows/astrix-weapon-nodes-implement.yml
          git config user.name 'ASTRIX Curation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add manifest-grounded equipped weapon reasoning nodes'
          git push origin HEAD:feature/astrix-multigame-platform
