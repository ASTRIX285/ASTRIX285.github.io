name: PARADOX validator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paradox-validator:
    name: PARADOX validator gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available for the scope guard
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        working-directory: astrix-app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run the full PARADOX validator suite
        run: node astrix-app/tools/paradox-validator.mjs
