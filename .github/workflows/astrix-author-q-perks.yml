name: ASTRIX q_perks Weapon Roll Authoring
on:
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-author-q-perks.yml']
permissions:
  contents: write
jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Author q_perks rolls and resolve manifest
        run: python3 .astrix-community/author_q_perks_rolls.py
      - name: Verify authored fixtures through loader and engine
        run: |
          cat > /tmp/verify.mjs <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import {pathToFileURL} from 'node:url';
          const root=process.cwd(),d=path.join(root,'astrix-app/data/paradox-forge/beta'),p=path.join(root,'astrix-app/pages/guardian-workspace-v2');
          const files=['ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json','beta-component-identities.json','beta-bungie-manifest-cache.json','beta-bungie-manifest-cache-trait-direction-extension.json'];const routes=new Map(files.map(n=>[n,path.join(d,n)]));
          globalThis.document={readyState:'loading',addEventListener(){},dispatchEvent(){return true},getElementById(){return null},querySelector(){return null},createElement(){return {setAttribute(){},appendChild(){},style:{},addEventListener(){}}}};globalThis.CustomEvent=class{constructor(t,i={}){this.type=t;this.detail=i.detail}};
          globalThis.fetch=async input=>{const s=String(input),n=[...routes.keys()].find(k=>s.endsWith(k));if(!n)return{ok:false,status:404,json:async()=>({})};const txt=await fs.readFile(routes.get(n),'utf8');return{ok:true,status:200,json:async()=>JSON.parse(txt)}};
          const loader=await import(pathToFileURL(path.join(p,'guardian-fixture-loader.mjs')).href+'?v='+Date.now());const engine=await import(pathToFileURL(path.join(p,'guardian-paradox-engine.mjs')).href+'?v='+Date.now());
          for(const id of ['PF-COMM-01','PF-COMM-04','PF-COMM-32']){const b=await loader.loadBetaFixture(id),a=engine.analyzeGuardianBuild(b);console.log('FIXTURE='+JSON.stringify({fixtureId:id,confidence:a.confidence.level,buildLoop:a.buildLoop.map(x=>({chain:x.chain,source:x.source})),weapons:a.weaponContribution.map(w=>({hash:w.hash,name:w.name,status:w.status,emits:w.emits??[],consumes:w.consumes??[],contributions:w.contributions??[],evidence:w.evidence}))}));}
          NODE
          node /tmp/verify.mjs
      - name: Commit data-only changes and remove scaffolding
        run: |
          set -euo pipefail
          rm -f .astrix-community/author_q_perks_rolls.py .github/workflows/astrix-author-q-perks.yml
          git config user.name 'ASTRIX Curation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Author guide q_perks weapon rolls for matched fixtures'
          git push origin HEAD:feature/astrix-multigame-platform
