name: ASTRIX Worker Check

on:
  push:
    branches:
      - feature/astrix-backend
    paths:
      - 'astrix-worker/**'
      - '.github/workflows/astrix-worker-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrix-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astrix-worker/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
