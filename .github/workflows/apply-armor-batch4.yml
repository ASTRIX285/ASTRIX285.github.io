name: Apply Armor batch 4

on:
  push:
    branches:
      - feature/astrix-component-library
    paths:
      - .github/workflows/apply-armor-batch4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-component-library
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact batch 4 data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'astrix-app/data/armor-3-components.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const source = { title: 'Destiny 2 Armor Set Bonus: Full List & Effects', publisher: 'blueberries.gg', date: '2026-07-08' };
          const updates = new Map([
            ["Nezarec's Nightmare", ['Scoring final blows against targets debuffed by a subclass element has an escalating chance to spawn an Orb of Power.', 'Performing a finisher execution against a powerful combatant grants Devour; while Devour is active you gain additional damage resistance against combatants.']],
            ["Oryx's Memory", ['Landing final blows on Guardians or powerful combatants generates additional ammo progress.', 'After securing a final blow on a powerful combatant, you become entirely invisible the next time your shields are broken.']],
            ['Pantheos Resplendent', ['Picking up ammo bricks grants stacks of Armor Charge; each stack held gives a passive bonus to your Health stat.', 'Dealing sustained damage to minibosses, Champions, and bosses increases your weapon damage against base and powerful combatants; a weapon final blow consumes one stack.']],
            ['Per Audacia', ['Primary-ammo weapon final blows grant a stacking bonus to your mobility, weapon range, and handling that lasts until you are defeated.', 'Passively increases your mobility stat while granting enhanced sprint speed and a longer slide distance.']],
            ['Promised', ['Defeating a powerful combatant generates Stable Resonance, granting damage resistance and increased weapon damage for its duration.', 'While Stable Resonance is active, continuing to deal weapon damage occasionally generates a resonance burst that damages and exhausts targets.']],
            ['Resonant Fury', ['Your health begins regenerating immediately after you take melee damage from a powerful combatant.', 'Landing weapon hits or Glaive melee strikes grants stacks; switching weapons heals you and consumes all active stacks.']],
            ['Reverie Dawn', ['Taking significant damage in a short window generates a Protective Wish, making you harder to hit and granting increased reload speed and flinch resistance.', 'When the Protective Wish expires naturally, it cures your health; securing rapid final blows ends it prematurely.']],
            ['Sage Protector', ['Landing Sword hits returns grenade and class ability energy, with bonus energy while Blade Focus is active.', 'Briefly guard with a Sword to ready Blade Focus; while readied, hitting a target with your sword increases sword damage and lunge distance for a moderate duration.']],
            ['Seventh Seraph', ['Final blows with area-of-effect damage, Solar abilities, or Seventh Seraph or IKELOS weapons grant Warmind Charges; each stack raises your baseline Weapons and Grenade stats.', 'While holding Warmind Charges, defeating powerful combatants or destroying a construct or Tangle releases a Solar detonation that damages combatants and heals nearby allies.']],
            ['Shrewd Survivor', ['Swapping to a Heat weapon, Submachine Gun, or Hand Cannon grants a short period of increased handling and accuracy, extended by dealing damage with that weapon.', 'Final blows while Reflex Action is active grant bonus weapon stats and increase stability, reload, and aim assist for Heat weapons, Submachine Guns, and Hand Cannons for a moderate duration.']]
          ]);
          const before = new Map(data.components.map(c => [c.name, JSON.stringify(c)]));
          const seen = new Set();
          for (const component of data.components) {
            if (!updates.has(component.name)) continue;
            const [two, four] = updates.get(component.name);
            component.effect = `${two}\n${four}`;
            component.verified = true;
            component.sources = [source];
            component.setBonus.twoPiece.effect = two;
            component.setBonus.twoPiece.verified = true;
            component.setBonus.fourPiece.effect = four;
            component.setBonus.fourPiece.verified = true;
            seen.add(component.name);
          }
          if (seen.size !== updates.size) throw new Error('Not all requested components were found');
          data.seedStatus.notes = 'Set-bonus names were seeded exactly from the user-provided names-only table. Thirty-nine of 56 set bonuses now include user-provided verified effects and cited sources. The remaining 17 set bonuses retain blank effects and sources with verification flags set to false pending verified source review.';
          for (const component of data.components) {
            if (!updates.has(component.name) && before.get(component.name) !== JSON.stringify(component)) {
              throw new Error(`Unexpected component change: ${component.name}`);
            }
          }
          const flain = data.components.find(c => c.name === 'Flain');
          if (!flain || flain.verified || flain.effect || flain.sources.length || flain.setBonus.twoPiece.effect || flain.setBonus.fourPiece.effect) throw new Error('Flain was modified');
          const verified = data.components.filter(c => c.verified).length;
          const unverified = data.components.filter(c => !c.verified).length;
          if (verified !== 39 || unverified !== 17) throw new Error(`Unexpected counts: ${verified}/${unverified}`);
          fs.writeFileSync(path, JSON.stringify(data));
          NODE
      - name: Validate updated data
        working-directory: astrix-app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run validate
      - name: Commit batch 4
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add astrix-app/data/armor-3-components.json
          git commit -m "Verify fourth set bonus effect batch"
          git push origin HEAD:feature/astrix-component-library
