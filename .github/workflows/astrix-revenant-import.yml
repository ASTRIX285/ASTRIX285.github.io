name: ASTRIX Revenant Fixture Import
'on':
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-revenant-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Import Revenant community fixtures
        run: python3 .astrix-community/revenant_import.py
      - name: Run full 55-fixture regression
        shell: bash
        run: |
          cat > /tmp/revenant-regression.mjs <<'NODE'
          import fs from 'node:fs/promises'; import path from 'node:path'; import {pathToFileURL} from 'node:url';
          const root=process.cwd(),dataRoot=path.join(root,'astrix-app/data/paradox-forge/beta');
          const names=['ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json','beta-component-identities.json','beta-bungie-manifest-cache.json','beta-bungie-manifest-cache-trait-direction-extension.json'];
          const routes=new Map(names.map(n=>[n,path.join(dataRoot,n)]));
          globalThis.document={readyState:'loading',addEventListener(){},dispatchEvent(){return true},getElementById(){return null},querySelector(){return null},createElement(){return {setAttribute(){},appendChild(){},style:{},addEventListener(){}}}};
          globalThis.CustomEvent=class{constructor(t,i={}){this.type=t;this.detail=i.detail}};
          globalThis.fetch=async input=>{const s=String(input),n=[...routes.keys()].find(k=>s.endsWith(k));if(!n)return{ok:false,status:404,json:async()=>({})};const txt=await fs.readFile(routes.get(n),'utf8');return{ok:true,status:200,json:async()=>JSON.parse(txt)}};
          const pr=path.join(root,'astrix-app/pages/guardian-workspace-v2');
          const loader=await import(pathToFileURL(path.join(pr,'guardian-fixture-loader.mjs')).href+'?revenant=1');
          const engine=await import(pathToFileURL(path.join(pr,'guardian-paradox-engine.mjs')).href+'?revenant=1');
          const list=await loader.listBetaFixtures();if(list.length!==55)throw new Error(`Expected 55 fixtures, got ${list.length}`);
          const counts={high:0,medium:0,insufficient:0,low:0};let totalLinks=0;const community=[];
          const raw=JSON.parse(await fs.readFile(path.join(dataRoot,'ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json'),'utf8'));const byId=new Map(raw.fixtures.map(x=>[x.fixtureId,x]));
          for(const f of list){const b=await loader.loadBetaFixture(f.fixtureId);const a=engine.analyzeGuardianBuild(b);counts[a.confidence.level]++;totalLinks+=a.buildLoop.length;if(['PF-COMM-30','PF-COMM-31','PF-COMM-32'].includes(f.fixtureId))community.push({fixtureId:f.fixtureId,sourceUrl:byId.get(f.fixtureId)?.sourceUrl,className:f.className,subclassName:f.subclassName,element:f.element,subclassHash:byId.get(f.fixtureId)?.subclassHash,curatedChainCount:(byId.get(f.fixtureId)?.synergyChains??[]).length,weaponContributionCount:(byId.get(f.fixtureId)?.weaponContribution??[]).length,engineChainCount:a.buildLoop.length,confidence:a.confidence.level,unresolved:b.beta?.unresolved??null});}
          console.log('REGRESSION_SUMMARY='+JSON.stringify({...counts,totalLinks,fixtures:list.length}));
          console.log('NEW_FIXTURE_REGRESSION='+JSON.stringify(community));
          console.log('REVENANT_REGRESSION='+JSON.stringify(community.filter(x=>x.className==='Hunter'&&x.subclassName==='Revenant'&&x.element==='Stasis')));
          if(!community.some(x=>x.className==='Hunter'&&x.subclassName==='Revenant'&&x.element==='Stasis'))throw new Error('Regression failed: no new fixture resolves to Revenant/Stasis Hunter');
          NODE
          node /tmp/revenant-regression.mjs
      - name: Commit additive Revenant batch and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ASTRIX Curation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astrix-app/data/paradox-forge/beta/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json astrix-app/data/paradox-forge/beta/beta-bungie-manifest-cache.json astrix-app/data/paradox-forge/beta/beta-component-identities.json
          git rm .astrix-community/revenant_import.py
          git rm .github/workflows/astrix-revenant-import.yml
          git commit -m 'Add 3 Revenant community-sourced Paradox Forge fixtures'
          git push origin HEAD:feature/astrix-multigame-platform
