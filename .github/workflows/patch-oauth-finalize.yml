name: Finalize ASTRIX OAuth

on:
  push:
    branches:
      - feature/astrix-backend
    paths:
      - '.github/workflows/patch-oauth-finalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-backend
      - name: Apply narrow OAuth finalization
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('astrix-worker/src/index.ts')
          text = index.read_text()
          old = '''  const response = Response.redirect(returnUrl.toString(), 302);\n  response.headers.set("Set-Cookie", sessionCookie(sessionId, Math.floor(SESSION_TTL_MS / 1000)));\n  response.headers.set("Cache-Control", "no-store");\n  return response;'''
          new = '''  return new Response(null, {\n    status: 302,\n    headers: {\n      Location: returnUrl.toString(),\n      "Set-Cookie": sessionCookie(sessionId, Math.floor(SESSION_TTL_MS / 1000)),\n      "Cache-Control": "no-store"\n    }\n  });'''
          if old not in text:
              raise SystemExit('Expected callback block not found; refusing to guess')
          index.write_text(text.replace(old, new))

          wrangler = Path('astrix-worker/wrangler.toml')
          cfg = wrangler.read_text()
          if 'pattern = "auth.astrixparadox.com"' not in cfg:
              marker = '[[durable_objects.bindings]]\n'
              route = '[[routes]]\npattern = "auth.astrixparadox.com"\ncustom_domain = true\n\n'
              if marker not in cfg:
                  raise SystemExit('Durable Object marker not found; refusing to guess')
              cfg = cfg.replace(marker, route + marker, 1)
              wrangler.write_text(cfg)
          PY
      - name: Commit source changes
        run: |
          git config user.name "ASTRIX OAuth Bot"
          git config user.email "actions@users.noreply.github.com"
          git add astrix-worker/src/index.ts astrix-worker/wrangler.toml
          git commit -m "Finalize Bungie OAuth callback and auth domain" || true
      - name: Self delete workflow
        run: |
          git rm .github/workflows/patch-oauth-finalize.yml
          git commit -m "Remove one-shot OAuth finalize workflow"
          git push origin feature/astrix-backend
