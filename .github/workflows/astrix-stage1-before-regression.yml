name: ASTRIX Pre Stage 1 Regression
on:
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-stage1-before-regression.yml']
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Run loader-engine against exact pre-Stage-1 fixture revision
        shell: bash
        run: |
          set -euo pipefail
          target='astrix-app/data/paradox-forge/beta/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json'
          cp "$target" /tmp/current-fixtures.json
          git show 5e52a3de5d789aed1cee9d5f2ae100e012609bff:"$target" > "$target"
          cat > /tmp/prestage1.mjs <<'NODE'
          import fs from 'node:fs/promises'; import path from 'node:path'; import {pathToFileURL} from 'node:url';
          const root=process.cwd(),dataRoot=path.join(root,'astrix-app/data/paradox-forge/beta'); const names=['ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json','beta-component-identities.json','beta-bungie-manifest-cache.json','beta-bungie-manifest-cache-trait-direction-extension.json']; const routes=new Map(names.map(n=>[n,path.join(dataRoot,n)]));
          globalThis.document={readyState:'loading',addEventListener(){},dispatchEvent(){return true},getElementById(){return null},querySelector(){return null},createElement(){return {setAttribute(){},appendChild(){},style:{},addEventListener(){}}}}; globalThis.CustomEvent=class{constructor(t,i={}){this.type=t;this.detail=i.detail}};
          globalThis.fetch=async input=>{const s=String(input),n=[...routes.keys()].find(k=>s.endsWith(k));if(!n)return{ok:false,status:404,json:async()=>({})};const txt=await fs.readFile(routes.get(n),'utf8');return{ok:true,status:200,json:async()=>JSON.parse(txt)}};
          const pr=path.join(root,'astrix-app/pages/guardian-workspace-v2'); const loader=await import(pathToFileURL(path.join(pr,'guardian-fixture-loader.mjs')).href+'?pre=1'); const engine=await import(pathToFileURL(path.join(pr,'guardian-paradox-engine.mjs')).href+'?pre=1'); const counts={high:0,medium:0,insufficient:0,low:0}; let totalLinks=0; const rows=[];
          for(const f of await loader.listBetaFixtures()){const b=await loader.loadBetaFixture(f.fixtureId);const a=engine.analyzeGuardianBuild(b);counts[a.confidence.level]++;totalLinks+=a.buildLoop.length;rows.push({fixtureId:f.fixtureId,level:a.confidence.level,links:a.buildLoop.length});}
          console.log('PRE_STAGE1_SUMMARY='+JSON.stringify({...counts,totalLinks,fixtures:rows.length})); console.log('PRE_STAGE1_ROWS='+JSON.stringify(rows));
          NODE
          node /tmp/prestage1.mjs
          mv /tmp/current-fixtures.json "$target"
          git diff --exit-code -- "$target"
      - name: Remove temporary baseline workflow
        if: always()
        run: |
          git config user.name 'ASTRIX Regression Bot'; git config user.email 'actions@users.noreply.github.com'; git checkout -- astrix-app/data/paradox-forge/beta/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json || true; git rm .github/workflows/astrix-stage1-before-regression.yml; git commit -m 'Remove temporary pre-Stage-1 regression workflow'; git push origin HEAD:feature/astrix-multigame-platform
