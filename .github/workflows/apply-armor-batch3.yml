name: Apply Armor batch 3

on:
  push:
    branches:
      - feature/astrix-component-library
    paths:
      - .github/workflows/apply-armor-batch3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-component-library
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact batch 3 data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'astrix-app/data/armor-3-components.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const source = { title: 'Destiny 2 Armor Set Bonus: Full List & Effects', publisher: 'blueberries.gg', date: '2026-07-08' };
          const updates = new Map([
            ['Great Hunt', ['Grenade final blows temporarily reduce your incoming damage.', 'Grenade final blows grant additional Heavy ammo generation progress.']],
            ['Iron Battalion Set', ['Passively increases the handling and reload speed of all Primary ammo weapons; your Primary weapons also deal increased damage to non-boss combatants based on your Weapons stat.', 'Securing final blows while your Super is active refunds a portion of your Super energy after the Super ends.']],
            ['Iron Panoply Set', ['As your health drops lower, your weapons gain increased stability and handling; weapon final blows while your shields are fully depleted heal you.', 'When your shields break, you temporarily gain increased ammo generation, flinch resistance, and damage resistance; final blows extend the effect.']],
            ['Kentarch 3', ['Standing near allies creates a relay network granting improved weapon handling and reload speed; being near other allies also running this additionally grants a bonus to your Health stat.', 'Weapon final blows grant melee energy to both you and nearby allies.']],
            ['Last Discipline', ['Primary-ammo final blows grant your Primary weapons temporarily increased reload speed.', 'Picking up an Orb of Power grants Special ammo progress.']],
            ["Legacy's Oath", ['Your powered melee attacks release an additional disorienting pulse when they defeat a target.', 'When your shields are broken by a combatant, or immediately upon casting your Super, you release a swarm of heat-seeking micro-missiles.']],
            ['Luminopotent', ['While amplified, your Fusion Rifles, Linear Fusion Rifles, and Heat weapons gain increased handling, reload, and vent cooling speeds.', 'Landing final blows with Jolt, or against jolted combatants, creates Ionic Traces that travel back to you.']],
            ['Lustrous', ['Receiving healing temporarily grants your Solar weapons increased flinch resistance, handling, and reload speed.', 'Rapid Solar final blows heal you.']],
            ['New Demotic', ['Your Primary-ammo weapons gain a significant flinch-resistance bonus for a brief moment after you perform a slide.', 'Your weapons gain a temporary boost to handling and aim-down-sights speed whenever an ally is defeated or you revive a teammate.']]
          ]);
          const before = new Map(data.components.map(c => [c.name, JSON.stringify(c)]));
          const seen = new Set();
          for (const component of data.components) {
            if (!updates.has(component.name)) continue;
            const [two, four] = updates.get(component.name);
            component.effect = `${two}\n${four}`;
            component.verified = true;
            component.sources = [source];
            component.setBonus.twoPiece.effect = two;
            component.setBonus.twoPiece.verified = true;
            component.setBonus.fourPiece.effect = four;
            component.setBonus.fourPiece.verified = true;
            seen.add(component.name);
          }
          if (seen.size !== updates.size) throw new Error('Not all requested components were found');
          data.seedStatus.notes = 'Set-bonus names were seeded exactly from the user-provided names-only table. Twenty-nine set bonuses now include user-provided verified effects and cited sources. The remaining 27 set bonuses retain blank effects and sources with verification flags set to false pending verified source review.';
          for (const component of data.components) {
            if (!updates.has(component.name) && before.get(component.name) !== JSON.stringify(component)) {
              throw new Error(`Unexpected component change: ${component.name}`);
            }
          }
          const flain = data.components.find(c => c.name === 'Flain');
          if (!flain || flain.verified || flain.effect || flain.sources.length || flain.setBonus.twoPiece.effect || flain.setBonus.fourPiece.effect) {
            throw new Error('Flain was modified');
          }
          const verified = data.components.filter(c => c.verified).length;
          const unverified = data.components.filter(c => !c.verified).length;
          if (verified !== 29 || unverified !== 27) throw new Error(`Unexpected counts: ${verified}/${unverified}`);
          fs.writeFileSync(path, JSON.stringify(data));
          NODE
      - name: Commit batch 3
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add astrix-app/data/armor-3-components.json
          git commit -m "Verify third set bonus effect batch"
          git push origin HEAD:feature/astrix-component-library
