name: Fix Community Import Manifest
'on':
  push:
    branches: [feature/astrix-multigame-platform]
    paths: [.github/workflows/astrix-community-import-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/astrix-community-import.yml')
          s=p.read_text()
          old="""          dbpath=Path('/tmp/world.content')
          dbpath.write_bytes(get('https://www.bungie.net'+mpath))
          con=sqlite3.connect(str(dbpath)); cur=con.cursor()
"""
          new="""          import zipfile, io, gzip
          payload=get('https://www.bungie.net'+mpath)
          dbpath=Path('/tmp/world.content')
          if payload[:2]==b'PK':
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  members=[n for n in z.namelist() if not n.endswith('/')]
                  if not members: raise RuntimeError('Bungie manifest ZIP had no file')
                  dbpath.write_bytes(z.read(members[0]))
          elif payload[:2]==b'\\x1f\\x8b':
              dbpath.write_bytes(gzip.decompress(payload))
          else:
              dbpath.write_bytes(payload)
          con=sqlite3.connect(str(dbpath)); cur=con.cursor()
"""
          if old not in s: raise SystemExit('target manifest block not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'ASTRIX Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/astrix-community-import.yml
          git rm .github/workflows/astrix-community-import-fix.yml
          git commit -m 'Handle packaged Bungie mobile manifest in community import'
          git push origin HEAD:feature/astrix-multigame-platform