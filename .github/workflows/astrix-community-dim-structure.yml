name: ASTRIX DIM Structure Probe
'on':
  push:
    branches: [feature/astrix-multigame-platform]
    paths: [.github/workflows/astrix-community-dim-structure.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/astrix-multigame-platform }
      - shell: bash
        run: |
          curl -sS -L -A 'Mozilla/5.0' 'https://dim.gg/oyx3bsa/SUPER-EASY-Bolt-Charge-Titan' -o /tmp/page
          echo '--- scripts ---'
          grep -oE '<script[^>]*>[^<]*</script>|<script[^>]*src="[^"]+"[^>]*>' /tmp/page | tail -20
          echo '--- candidate markers ---'
          grep -oE '.{0,120}(loadout|equipped|socketOverrides|classType|modsByBucket|oyx3bsa).{0,240}' /tmp/page | head -50
      - if: always()
        shell: bash
        run: |
          git config user.name 'ASTRIX Probe Bot'; git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/astrix-community-dim-structure.yml
          git commit -m 'Remove temporary DIM structure probe'
          git push origin HEAD:feature/astrix-multigame-platform