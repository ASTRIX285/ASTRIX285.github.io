name: ASTRIX Perk Evidence Probe
'on':
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-perk-evidence-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
      - run: python3 .astrix-community/perk_evidence_probe.py
