name: ASTRIX Stage 3 Candidate Curation
on:
  push:
    branches: [feature/astrix-multigame-platform]
    paths:
      - '.astrix-stage3/**'
      - '.github/workflows/astrix-stage3-curate.yml'
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Apply three evidence-backed candidate chains
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const target='astrix-app/data/paradox-forge/beta/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json';
          const patch=JSON.parse(fs.readFileSync('.astrix-stage3/candidate-curation-patch.json','utf8'));
          const data=JSON.parse(fs.readFileSync(target,'utf8'));
          const baseline={fixtures:data.fixtures.length,chains:data.fixtures.reduce((n,f)=>n+(f.synergyChains?.length??0),0),mutations:data.fixtures.reduce((n,f)=>n+(f.mutationCases?.length??0),0),weapons:data.fixtures.reduce((n,f)=>n+(f.weaponContribution?.length??0),0)};
          if(JSON.stringify(baseline)!==JSON.stringify({fixtures:23,chains:33,mutations:7,weapons:1})) throw new Error('Unexpected Stage 2 baseline '+JSON.stringify(baseline));
          let added=0;
          for(const f of data.fixtures){
            for(const c of patch[f.fixtureId]??[]){
              const key=x=>`${Number(x.from?.hash)}|${x.output}|${Number(x.to?.hash)}`;
              if((f.synergyChains??[]).some(x=>key(x)===key(c))) throw new Error(`Duplicate curated chain ${f.fixtureId}: ${key(c)}`);
              f.synergyChains.push(c); added++;
            }
          }
          if(added!==3) throw new Error('Expected 3 new chains, got '+added);
          fs.writeFileSync(target,JSON.stringify(data));
          console.log('CURATION_SUMMARY='+JSON.stringify({baselineCuratedChains:33,added,newCuratedChains:36,unresolvedChosen:0}));
          NODE
      - name: Run real loader-engine regression
        shell: bash
        run: |
          cat > /tmp/regression.mjs <<'NODE'
          import fs from 'node:fs/promises'; import path from 'node:path'; import {pathToFileURL} from 'node:url';
          const root=process.cwd(), dataRoot=path.join(root,'astrix-app/data/paradox-forge/beta');
          const names=['ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json','beta-component-identities.json','beta-bungie-manifest-cache.json','beta-bungie-manifest-cache-trait-direction-extension.json']; const routes=new Map(names.map(n=>[n,path.join(dataRoot,n)]));
          globalThis.document={readyState:'loading',addEventListener(){},dispatchEvent(){return true},getElementById(){return null},querySelector(){return null},createElement(){return {setAttribute(){},appendChild(){},style:{},addEventListener(){}}}}; globalThis.CustomEvent=class{constructor(t,i={}){this.type=t;this.detail=i.detail}};
          globalThis.fetch=async input=>{const s=String(input),n=[...routes.keys()].find(k=>s.endsWith(k));if(!n)return{ok:false,status:404,json:async()=>({})};const txt=await fs.readFile(routes.get(n),'utf8');return{ok:true,status:200,json:async()=>JSON.parse(txt)}};
          const pr=path.join(root,'astrix-app/pages/guardian-workspace-v2'); const loader=await import(pathToFileURL(path.join(pr,'guardian-fixture-loader.mjs')).href+'?stage3=1'); const engine=await import(pathToFileURL(path.join(pr,'guardian-paradox-engine.mjs')).href+'?stage3=1');
          const expectedLinks={
            'PF-BETA-03':'3769507632|jolt|4194622038',
            'PF-BETA-04':'3769507632|jolt|4194622036',
            'PF-BETA-11':'2272984668|weaken|2661180601'
          };
          const counts={high:0,medium:0,insufficient:0,low:0}; let totalLinks=0; const touched={};
          for(const f of await loader.listBetaFixtures()){
            const b=await loader.loadBetaFixture(f.fixtureId); const a=engine.analyzeGuardianBuild(b); counts[a.confidence.level]++; totalLinks+=a.buildLoop.length;
            if(expectedLinks[f.fixtureId]){
              const sig=l=>`${Number(l.from?.hash)}|${l.output}|${Number(l.to?.hash)}`;
              const link=a.buildLoop.find(l=>sig(l)===expectedLinks[f.fixtureId]);
              if(!link) throw new Error(`Missing new chain in ${f.fixtureId}`);
              const sources=(link.evidenceSources??[]).map(x=>x.source); if(!sources.includes('curated-fixture-data') && !String(link.source).includes('curated-fixture-data')) throw new Error(`New chain lacks curated source in ${f.fixtureId}`);
              const [aHash,effect,bHash]=expectedLinks[f.fixtureId].split('|');
              const stillCandidate=(a.candidateRelationships??[]).some(c=>c.effect===effect && new Set((c.items??[]).map(x=>String(x.hash))).has(aHash) && new Set((c.items??[]).map(x=>String(x.hash))).has(bHash));
              touched[f.fixtureId]={level:a.confidence.level,links:a.buildLoop.length,source:link.source,evidenceSources:sources,stillCandidate};
            }
          }
          const summary={...counts,totalLinks,fixtures:23}; console.log('REGRESSION_SUMMARY='+JSON.stringify(summary)); console.log('TOUCHED='+JSON.stringify(touched));
          NODE
          node /tmp/regression.mjs
      - name: Commit data and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ASTRIX Curation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astrix-app/data/paradox-forge/beta/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json
          git rm -r .astrix-stage3
          git rm .github/workflows/astrix-stage3-curate.yml
          git commit -m 'Curate three directional trait relationships'
          git push origin HEAD:feature/astrix-multigame-platform
