name: ASTRIX Weapon Roll Probe
'on':
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-weapon-roll-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
      - name: Probe DIM weapon roll evidence
        run: python3 .astrix-community/weapon_roll_probe.py
