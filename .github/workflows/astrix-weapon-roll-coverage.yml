name: ASTRIX Weapon Roll Coverage
'on':
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-weapon-roll-coverage.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
      - name: Audit community weapon roll coverage
        run: python3 .astrix-community/weapon_roll_coverage.py
