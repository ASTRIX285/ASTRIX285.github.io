name: ASTRIX Stage 3 Candidate Probe
on:
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-stage3-candidate-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/astrix-multigame-platform }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Print unresolved candidates
        shell: bash
        run: |
          cat > /tmp/candidates.mjs <<'NODE'
          import fs from 'node:fs/promises'; import path from 'node:path'; import {pathToFileURL} from 'node:url';
          const root=process.cwd(), dataRoot=path.join(root,'astrix-app/data/paradox-forge/beta');
          const names=['ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json','beta-component-identities.json','beta-bungie-manifest-cache.json','beta-bungie-manifest-cache-trait-direction-extension.json']; const routes=new Map(names.map(n=>[n,path.join(dataRoot,n)]));
          globalThis.document={readyState:'loading',addEventListener(){},dispatchEvent(){return true},getElementById(){return null},querySelector(){return null},createElement(){return {setAttribute(){},appendChild(){},style:{},addEventListener(){}}}}; globalThis.CustomEvent=class{constructor(t,i={}){this.type=t;this.detail=i.detail}};
          globalThis.fetch=async input=>{const s=String(input),n=[...routes.keys()].find(k=>s.endsWith(k));if(!n)return{ok:false,status:404,json:async()=>({})};const txt=await fs.readFile(routes.get(n),'utf8');return{ok:true,status:200,json:async()=>JSON.parse(txt)}};
          const pr=path.join(root,'astrix-app/pages/guardian-workspace-v2'); const loader=await import(pathToFileURL(path.join(pr,'guardian-fixture-loader.mjs')).href+'?c=1'); const engine=await import(pathToFileURL(path.join(pr,'guardian-paradox-engine.mjs')).href+'?c=1');
          for(const f of await loader.listBetaFixtures()){const b=await loader.loadBetaFixture(f.fixtureId);const a=engine.analyzeGuardianBuild(b);if(a.candidateRelationships?.length){console.log('FIXTURE '+f.fixtureId);for(const c of a.candidateRelationships)console.log(JSON.stringify(c));}}
          NODE
          node /tmp/candidates.mjs
      - name: Remove probe
        if: always()
        run: |
          git config user.name 'ASTRIX Probe Bot'; git config user.email 'actions@users.noreply.github.com'; git rm .github/workflows/astrix-stage3-candidate-probe.yml; git commit -m 'Remove temporary Stage 3 candidate probe'; git push origin HEAD:feature/astrix-multigame-platform
