name: ASTRIX Probe Current Artifact
on:
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/astrix-probe-current-artifact.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
      - name: Probe live Bungie artifact mapping
        run: python3 .astrix-community/probe-current-artifact.py
