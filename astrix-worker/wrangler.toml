name = "astrix-destiny-backend"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[vars]
ENVIRONMENT = "scaffold"
APP_ORIGIN = "https://app.astrixparadox.com"

# OAuth gate: custom domains are intentionally not activated by this scaffold.
# Miguel must provision and verify the Cloudflare zone and Worker first.
# After verification, add both Custom Domains in the Cloudflare dashboard or
# deliberately uncomment equivalent route configuration.
#
# [[routes]]
# pattern = "api.astrixparadox.com"
# custom_domain = true
#
# [[routes]]
# pattern = "auth.astrixparadox.com"
# custom_domain = true

# OAuth gate: do not place BUNGIE_CLIENT_SECRET under [vars].
# It will be created later as an encrypted Worker secret after provisioning.
